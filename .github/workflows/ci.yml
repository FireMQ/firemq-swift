name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start FireMQ from the same release as the XCFramework
        run: |
          tag=$(sed -n 's|.*/releases/download/\(v[^/]*\)/FireMQFFI\.xcframework\.zip.*|\1|p' Package.swift)
          curl -fsSL "https://github.com/FireMQ/firemq/releases/download/$tag/firemq-aarch64-apple-darwin.tar.gz" | tar -xz
          firemq-aarch64-apple-darwin/firemq --ephemeral > firemq.log 2>&1 &
          for i in $(seq 1 100); do nc -z 127.0.0.1 5673 && break; sleep 0.1; done
      - run: swift build
      - run: swift run HelloFireMQ
      - name: Build for iOS and the iOS simulator
        run: |
          xcodebuild build -quiet -scheme FireMQ -destination 'generic/platform=iOS'
          xcodebuild build -quiet -scheme FireMQ -destination 'generic/platform=iOS Simulator'
      - if: always()
        run: tail -n 50 firemq.log || true
